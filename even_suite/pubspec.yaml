name: even_suite
description: "Even Suite: the Even Realities G1 demo app, made friendlier, with Claude and Termux."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

# Packages from the open-source EvenDemoApp, plus sherpa-onnx for the
# optional on-phone Parakeet recognizer (the same one the Vox app uses).
# Everything else (Android speech, settings, HTTP) uses Android or the
# Dart/Flutter SDK directly.
dependencies:
  flutter:
    sdk: flutter
  crclib: ^3.0.0
  sherpa_onnx: 1.13.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
