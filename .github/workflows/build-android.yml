name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [claude/laughing-cerf-zer2dj]
    paths: ['mobile-app/**', '.github/workflows/build-android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: vox-amelior-debug-apk
          path: mobile-app/build/app/outputs/flutter-apk/app-debug.apk
