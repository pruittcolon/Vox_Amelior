name: Export Parakeet RNNT 1.1B for sherpa-onnx
# Converts nvidia/parakeet-rnnt-1.1b (the model the Vox server uses) into the
# int8 encoder/decoder/joiner layout sherpa-onnx loads on Android, checks it
# on a real speech sample and publishes it as a release the app downloads.
on:
  workflow_dispatch:
  push:
    branches: [claude/laughing-cerf-zer2dj]
    paths: ['.github/workflows/export-parakeet-rnnt.yml']
permissions:
  contents: write
env:
  TAG: parakeet-rnnt-1.1b-int8
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Make room (disk and swap)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo fallocate -l 24G /mnt/extra.swap && sudo chmod 600 /mnt/extra.swap
          sudo mkswap /mnt/extra.swap && sudo swapon /mnt/extra.swap
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          df -h / /mnt; free -g
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install NeMo
        run: |
          pip install --upgrade pip
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "nemo_toolkit[asr]>=2.2,<2.5" "torch==2.6.0" onnx onnxruntime sherpa-onnx soundfile
          pip list 2>/dev/null | grep -i -E "^(torch|nemo|onnx|onnxruntime|sherpa|numpy) "
      - name: Export and quantize
        working-directory: /mnt/work
        env:
          HF_HOME: /mnt/work/hf
        run: |
          python3 - <<'PY'
          import os
          import onnx
          import torch
          import nemo.collections.asr as nemo_asr
          from onnxruntime.quantization import QuantType, quantize_dynamic

          os.makedirs('fp32', exist_ok=True)
          os.makedirs('out', exist_ok=True)
          with torch.no_grad():
              m = nemo_asr.models.ASRModel.from_pretrained('nvidia/parakeet-rnnt-1.1b', map_location='cpu')
              m.eval()
              with open('out/tokens.txt', 'w', encoding='utf-8') as f:
                  for i, s in enumerate(m.joint.vocabulary):
                      f.write(f'{s} {i}\n')
                  f.write(f'<blk> {i + 1}\n')
              m.encoder.export('fp32/encoder.onnx')
              m.decoder.export('fp32/decoder.onnx')
              m.joint.export('fp32/joiner.onnx')

          pre = m.cfg.preprocessor
          normalize = pre.normalize if pre.normalize != 'NA' else ''
          meta = {
              'vocab_size': m.decoder.vocab_size,
              'normalize_type': normalize,
              'pred_rnn_layers': m.decoder.pred_rnn_layers,
              'pred_hidden': m.decoder.pred_hidden,
              'subsampling_factor': m.cfg.encoder.subsampling_factor,
              'model_type': 'EncDecRNNTBPEModel',
              'version': '2',
              'model_author': 'NeMo',
              'url': 'https://huggingface.co/nvidia/parakeet-rnnt-1.1b',
              'comment': 'Exported for sherpa-onnx by Vox Amelior CI',
              'feat_dim': pre.features,
          }
          print('meta', meta)
          del m

          quantize_dynamic('fp32/encoder.onnx', 'fp32/encoder.int8.onnx',
                           weight_type=QuantType.QUInt8, use_external_data_format=True)
          for name in ('decoder', 'joiner'):
              quantize_dynamic(f'fp32/{name}.onnx', f'out/{name}.int8.onnx', weight_type=QuantType.QInt8)

          enc = onnx.load('fp32/encoder.int8.onnx')
          del enc.metadata_props[:]
          for k, v in meta.items():
              p = enc.metadata_props.add()
              p.key, p.value = k, str(v)
          onnx.save(enc, 'out/encoder.int8.onnx', save_as_external_data=True,
                    all_tensors_to_one_file=True, location='encoder.int8.weights')
          PY
          ls -l out
      - name: Transcribe a real speech sample with sherpa-onnx
        run: |
          python3 - <<'PY'
          import time, wave
          import numpy as np
          import sherpa_onnx
          d = '/mnt/work/out'
          with wave.open('vox_mobile/test/fixtures/speech.wav') as w:
              audio = np.frombuffer(w.readframes(w.getnframes()), dtype=np.int16).astype(np.float32) / 32768
              sr = w.getframerate()
          rec = sherpa_onnx.OfflineRecognizer.from_transducer(
              encoder=f'{d}/encoder.int8.onnx', decoder=f'{d}/decoder.int8.onnx', joiner=f'{d}/joiner.int8.onnx',
              tokens=f'{d}/tokens.txt', num_threads=2, model_type='nemo_transducer')
          s = rec.create_stream()
          s.accept_waveform(sr, audio)
          t = time.time()
          rec.decode_stream(s)
          dt, secs = time.time() - t, len(audio) / sr
          print(f'RNNT 1.1B int8: {dt:.2f}s for {secs:.1f}s audio (RTF {dt / secs:.3f}): {s.result.text}')
          assert len(s.result.text.split()) >= 3, 'transcript is empty or garbage'
          PY
      - name: Publish release
        working-directory: /mnt/work/out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in *; do echo "$f $(stat -c %s "$f") $(sha256sum "$f" | cut -d' ' -f1)"; done | tee SHA256SUMS.txt
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NVIDIA Parakeet RNNT 1.1B (int8, sherpa-onnx)" \
            --notes "nvidia/parakeet-rnnt-1.1b (CC-BY-4.0) converted to sherpa-onnx int8 by CI. Downloaded by the Vox app." \
            encoder.int8.onnx encoder.int8.weights decoder.int8.onnx joiner.int8.onnx tokens.txt SHA256SUMS.txt
