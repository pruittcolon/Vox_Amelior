name: Verify Parakeet 1.1B models
on:
  workflow_dispatch:
  push:
    branches: [claude/laughing-cerf-zer2dj]
    paths: ['.github/workflows/verify-asr.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install sherpa-onnx numpy
      - name: Download and transcribe
        run: |
          python3 - <<'PY'
          import hashlib, os, time, urllib.request, wave
          import numpy as np
          import sherpa_onnx

          def dl(repo, files, d):
              os.makedirs(d, exist_ok=True)
              for f in files:
                  p = os.path.join(d, f)
                  urllib.request.urlretrieve(f'https://huggingface.co/{repo}/resolve/main/{f}', p)
                  h = hashlib.sha256(open(p, 'rb').read()).hexdigest()
                  print(f'{repo}/{f} {os.path.getsize(p)} sha256={" ".join(h[i:i+16] for i in range(0, 64, 16))}')

          with wave.open('vox_mobile/test/fixtures/speech.wav') as w:
              audio = np.frombuffer(w.readframes(w.getnframes()), dtype=np.int16).astype(np.float32) / 32768
              sr = w.getframerate()
          secs = len(audio) / sr

          def run(name, rec):
              s = rec.create_stream()
              s.accept_waveform(sr, audio)
              t = time.time()
              rec.decode_stream(s)
              dt = time.time() - t
              print(f'== {name}: {dt:.2f}s for {secs:.1f}s audio (RTF {dt/secs:.3f}): {s.result.text}')

          dl('mortenfc/sherpa-onnx-parakeet-tdt-1.1b-int8',
             ['encoder.int8.onnx', 'encoder.int8.weights', 'decoder.int8.onnx', 'joiner.int8.onnx', 'tokens.txt'], 'tdt')
          try:
              run('TDT 1.1B', sherpa_onnx.OfflineRecognizer.from_transducer(
                  encoder='tdt/encoder.int8.onnx', decoder='tdt/decoder.int8.onnx', joiner='tdt/joiner.int8.onnx',
                  tokens='tdt/tokens.txt', num_threads=2, model_type='nemo_transducer'))
          except Exception as e:
              print('TDT FAILED', e)
          dl('runanywhere/sherpa-onnx-nemo-parakeet-ctc-1.1b-int8', ['model.int8.onnx', 'tokens.txt'], 'ctc')
          try:
              run('CTC 1.1B', sherpa_onnx.OfflineRecognizer.from_nemo_ctc(
                  model='ctc/model.int8.onnx', tokens='ctc/tokens.txt', num_threads=2))
          except Exception as e:
              print('CTC FAILED', e)
          PY
