name: Probe model repositories
on:
  workflow_dispatch:
  push:
    branches: [claude/laughing-cerf-zer2dj]
    paths: ['.github/workflows/probe-models.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find Parakeet RNNT 1.1B exports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "== sherpa-onnx release assets matching 1.1b / rnnt"
          for tag in asr-models speaker-recongition-models; do
            gh api --paginate "repos/k2-fsa/sherpa-onnx/releases/tags/$tag" --jq '.assets[] | "\(.name) \(.size)"' 2>/dev/null | grep -iE "1\.1b|1_1b|1-1b|rnnt" || true
          done
          echo "== sherpa docs mentions"
          for u in offline-transducer/nemo-transducer-models.html offline-ctc/nemo/english.html offline-transducer/index.html; do
            curl -sS "https://k2-fsa.github.io/sherpa/onnx/pretrained_models/$u" | grep -oiE "[a-z0-9_.-]*(1\.1b|1_1b)[a-z0-9_.-]*" | sort -u || true
          done
          echo "== Hugging Face repos"
          python3 - <<'PY'
          import json, urllib.request
          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      return json.load(r)
              except Exception as e:
                  return []
          ids = set()
          for q in ['rnnt-1.1b', 'rnnt_1.1b', 'parakeet-rnnt', 'parakeet_rnnt', 'rnnt-1.1b-onnx', 'parakeet-1.1b', 'parakeet 1.1b']:
              for m in get(f'https://huggingface.co/api/models?search={q.replace(" ", "%20")}&limit=200'):
                  ids.add(m['id'])
          for s in sorted(ids):
              print(' ', s)
          for s in sorted(ids):
              if '1.1b' not in s.lower() and '1_1b' not in s.lower():
                  continue
              t = get(f'https://huggingface.co/api/models/{s}/tree/main')
              names = [f"{f.get('path')} {f.get('size')}" for f in t if not str(f.get('path','')).startswith(('onnx__', 'layers.', 'pre_encode'))]
              print('---', s, '|', '; '.join(names)[:600])
          PY
