name: Probe model repositories
on:
  workflow_dispatch:
  push:
    branches: [claude/laughing-cerf-zer2dj]
    paths: ['.github/workflows/probe-models.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: sherpa-onnx NeMo export scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/k2-fsa/sherpa-onnx/contents/scripts/nemo --jq '.[].name'
          for d in parakeet-tdt-0.6b-v2 parakeet-tdt-0.6b-v3; do
            echo "== $d"; gh api "repos/k2-fsa/sherpa-onnx/contents/scripts/nemo/$d" --jq '.[].name' || true
          done
          echo "===== export script"
          curl -sSL https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/master/scripts/nemo/parakeet-tdt-0.6b-v2/export_onnx.py || true
          echo "===== run script"
          curl -sSL https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/master/scripts/nemo/parakeet-tdt-0.6b-v2/run.sh || true
