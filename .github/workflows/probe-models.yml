name: Probe model repositories
on:
  workflow_dispatch:
  push:
    branches: [claude/laughing-cerf-zer2dj]
    paths: ['.github/workflows/probe-models.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Search Hugging Face
        run: |
          python3 - <<'PY'
          import json, urllib.request
          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      return json.load(r)
              except Exception as e:
                  return {'error': str(e)}
          def tree(repo):
              t = get(f'https://huggingface.co/api/models/{repo}/tree/main')
              info = get(f'https://huggingface.co/api/models/{repo}')
              print(f'--- {repo} gated={info.get("gated") if isinstance(info, dict) else "?"}')
              if isinstance(t, list):
                  ext = [f for f in t if str(f.get('path','')).startswith('onnx__') or '.weight' in str(f.get('path','')) and not str(f.get('path','')).endswith('.weights')]
                  if ext:
                      print('    (%d external tensor files, %d bytes)' % (len(ext), sum(f.get('size') or 0 for f in ext)))
                  for f in t:
                      if f in ext:
                          continue
                      oid = (f.get('lfs') or {}).get('oid') or ''
                      print('   ', f.get('path'), f.get('size'), ' '.join(oid[i:i+16] for i in range(0, len(oid), 16)))
              else:
                  print('   ', t)
          seen = set()
          for q in ['parakeet-rnnt-1.1b', 'parakeet-tdt-1.1b', 'parakeet_rnnt_1.1b', 'parakeet-ctc-1.1b', 'rnnt-1.1b']:
              res = get(f'https://huggingface.co/api/models?search={q}&limit=100')
              if isinstance(res, list):
                  for m in res:
                      seen.add(m['id'])
          print('PARAKEET 1.1B REPOS:', len(seen))
          for s in sorted(seen):
              print('  ', s)
          for s in sorted(seen):
              low = s.lower()
              if 'onnx' in low or 'sherpa' in low or 'csukuangfj' in low or 'k2-fsa' in low:
                  tree(s)
          PY
