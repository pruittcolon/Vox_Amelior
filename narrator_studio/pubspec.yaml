name: narrator_studio
description: "Reads .txt and .pdf files aloud in many free on-device voices and turns scripts into podcasts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # On-device speech: Kokoro voices, Pocket TTS voice cloning, Supertonic.
  sherpa_onnx: ^1.13.8
  # PDF text (PDFium).
  pdfrx: ^2.6.5
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.7
  # Unzips the espeak-ng pronunciation data that comes with the voices.
  archive: ^4.3.0
  # Native memory for the ONNX Runtime calls (the Clarity upscaler).
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The on-device test (integration_test/, run on an emulator in CI).
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Inter (interface), Fraunces (titles), Literata (reading). SIL Open Font License.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces72ptSoft-Regular.ttf
        - asset: assets/fonts/Fraunces72ptSoft-SemiBold.ttf
          weight: 600
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Medium.ttf
          weight: 500
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600
  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/Fraunces-OFL.txt
    - assets/fonts/Literata-OFL.txt
